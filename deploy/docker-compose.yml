networks:
  web:
    driver: bridge
  internal:
    driver: bridge
    internal: false

volumes:
  postgres_data:
  redis_data:
  nginx_logs:
  backup_logs:

services:
  # ── API Service (Active HTTP / WS Server) ─────────────────────────────────
  api:
    image: ${APP_IMAGE:-ghcr.io/osamasaeed/e-learning-platform:latest}
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - APP_MODE=api
      - PORT=3005
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public&sslmode=disable
      - DIRECT_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public&sslmode=disable
      - REDIS_ENABLED=true
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - TRUST_PROXY=1
    env_file:
      - ../.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3005/readyz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - web
      - internal
    deploy:
      resources:
        limits:
          memory: ${API_MEMORY_LIMIT:-2048M}

  # ── Worker Service (Crons & BullMQ Queues) ───────────────────────────────
  worker:
    image: ${APP_IMAGE:-ghcr.io/osamasaeed/e-learning-platform:latest}
    restart: unless-stopped
    environment:
      - APP_MODE=worker
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public&sslmode=disable
      - DIRECT_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public&sslmode=disable
      - REDIS_ENABLED=true
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
    env_file:
      - ../.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: ${WORKER_MEMORY_LIMIT:-1024M}

  # ── PostgreSQL Database ──────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-elearning}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init-roles.sh:/docker-entrypoint-initdb.d/init-roles.sh:ro
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: ${PG_MEMORY_LIMIT:-2560M}

  # ── Redis Cache & Queues ─────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: ["redis-server", "/usr/local/etc/redis/redis.conf", "--requirepass", "${REDIS_PASSWORD}", "--maxmemory", "${REDIS_MAXMEMORY:-1024mb}"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: ${REDIS_MEMORY_LIMIT:-1280M}

  # ── Nginx Reverse Proxy (Cloudflare Strict TLS) ──────────────────────────
  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/site.conf:/etc/nginx/conf.d/site.conf:ro
      - ./nginx/upstream.conf:/etc/nginx/conf.d/upstream.conf:ro
      - ./nginx/cloudflare-ips.conf:/etc/nginx/conf.d/cloudflare-ips.conf:ro
      - ./nginx/ssl:/etc/ssl/cloudflare:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - web
      - internal

  # ── Automated Backup Agent (Daily Encrypted Dump to R2/S3) ───────────────
  backup:
    image: alpine:3.19
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data:ro
      - ./scripts/backup.sh:/usr/local/bin/backup.sh:ro
      - /root/.config/rclone/rclone.conf:/root/.config/rclone/rclone.conf:ro
      - backup_logs:/var/log/backup
    environment:
      - PGHOST=postgres
      - PGPORT=5432
      - PGUSER=${POSTGRES_USER:-postgres}
      - PGPASSWORD=${POSTGRES_PASSWORD}
      - PGDATABASE=${POSTGRES_DB:-elearning}
      - RCLONE_CONFIG=/root/.config/rclone/rclone.conf
      - BACKUP_STORAGE_DEST=${BACKUP_STORAGE_DEST:-r2:teacher-backups}
      - BACKUP_ENCRYPTION_PASSPHRASE=${BACKUP_ENCRYPTION_PASSPHRASE}
      - HEALTHCHECK_URL=${HEALTHCHECK_URL:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - TENANT_NAME=${TENANT_NAME:-teacher-default}
    command: >
      sh -c "apk add --no-cache postgresql-client rclone gnupg curl bash &&
             mkdir -p /var/log/backup &&
             echo '0 3 * * * /usr/local/bin/backup.sh >> /var/log/backup/backup.log 2>&1' > /etc/crontabs/root &&
             crond -f -l 2"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  # ── Observability Exporters & Log Shipper ────────────────────────────────
  node-exporter:
    image: prom/node-exporter:v1.7.0
    restart: unless-stopped
    command:
      - '--path.rootfs=/host'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /:/host:ro,rslave
    networks:
      - internal

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg
    networks:
      - internal

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  redis-exporter:
    image: oliver006/redis_exporter:v1.58.0
    restart: unless-stopped
    environment:
      REDIS_ADDR: "redis:6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - internal

  promtail:
    image: grafana/promtail:2.9.4
    restart: unless-stopped
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - nginx_logs:/var/log/nginx:ro
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
    environment:
      - MONITORING_LOKI_HOST=${MONITORING_LOKI_HOST:-127.0.0.1}
      - TENANT_NAME=${TENANT_NAME:-teacher-default}
    command: -config.file=/etc/promtail/config.yml -config.expand-env=true
    networks:
      - internal
