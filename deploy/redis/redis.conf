# Network
bind 0.0.0.0
protected-mode yes
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

# Persistence: AOF everysec (Q10 decision)
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Periodic RDB snapshots as secondary durability
save 900 1
save 300 10
save 60 10000
dbfilename dump.rdb
dir /data

# Memory & Eviction (Q10 decision: noeviction)
# maxmemory is set per preset in docker-compose.yml via command line or here
maxmemory 1024mb
maxmemory-policy noeviction

# Performance & Logging
loglevel notice
logfile ""
slowlog-log-slower-than 10000
slowlog-max-len 128
