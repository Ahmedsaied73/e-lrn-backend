global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'elearning-fleet-monitor'

rule_files:
  - '/etc/prometheus/alert.rules.yml'

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  # ── Node Host Metrics ───────────────────────────────────────────────────────
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          role: 'host'

  # ── Container Metrics (cAdvisor) ────────────────────────────────────────────
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          role: 'containers'

  # ── PostgreSQL Metrics ──────────────────────────────────────────────────────
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          role: 'database'

  # ── Redis Metrics ───────────────────────────────────────────────────────────
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          role: 'cache'

  # ── Backend Application Metrics ─────────────────────────────────────────────
  - job_name: 'app-api'
    metrics_path: '/metrics'
    scheme: 'http'
    bearer_token: '${METRICS_TOKEN}'
    static_configs:
      - targets: ['api:3005']
        labels:
          role: 'api'
