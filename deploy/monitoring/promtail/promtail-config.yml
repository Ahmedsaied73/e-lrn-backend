server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://${MONITORING_LOKI_HOST:-loki}:3100/loki/api/v1/push

scrape_configs:
  # ── Scrape Docker container logs ───────────────────────────────────────────
  - job_name: docker-containers
    static_configs:
      - targets:
          - localhost
        labels:
          job: docker
          tenant: ${TENANT_NAME:-teacher-default}
          __path__: /var/lib/docker/containers/*/*-json.log
    pipeline_stages:
      - json:
          expressions:
            log: log
            stream: stream
            time: time
      - timestamp:
          source: time
          format: RFC3339Nano

  # ── Scrape Nginx structured JSON access logs ──────────────────────────────
  - job_name: nginx-json
    static_configs:
      - targets:
          - localhost
        labels:
          job: nginx
          tenant: ${TENANT_NAME:-teacher-default}
          __path__: /var/log/nginx/access.log
    pipeline_stages:
      - json:
          expressions:
            remote_addr: remote_addr
            status: status
            request_method: request_method
            request_uri: request_uri
            request_time: request_time
            cf_connecting_ip: cf_connecting_ip
      - labels:
          status:
          request_method:
