networks:
  monitoring:
    driver: bridge
  teacher_internal:
    name: teacher_internal
    external: true

volumes:
  prometheus_data:
  loki_data:
  grafana_data:
  alertmanager_data:

services:
  prometheus:
    image: prom/prometheus:v2.50.0
    restart: unless-stopped
    entrypoint: /entrypoint.sh
    environment:
      - METRICS_TOKEN=${METRICS_TOKEN:-}
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml.template:ro
      - ./prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - ./prometheus/entrypoint.sh:/entrypoint.sh:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_BIND_IP:-127.0.0.1}:9090:9090"
    networks:
      - monitoring
      - teacher_internal

  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    entrypoint: /entrypoint.sh
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-123456789}
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml.template:ro
      - ./alertmanager/entrypoint.sh:/entrypoint.sh:ro
      - alertmanager_data:/alertmanager
    ports:
      - "${ALERTMANAGER_BIND_IP:-127.0.0.1}:9093:9093"
    networks:
      - monitoring

  loki:
    image: grafana/loki:2.9.4
    restart: unless-stopped
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - ./loki/rules:/loki/rules:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "${LOKI_BIND_IP:-127.0.0.1}:3100:3100"
    networks:
      - monitoring
      - teacher_internal

  grafana:
    image: grafana/grafana:10.3.3
    restart: unless-stopped
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin_change_me}
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "${GRAFANA_BIND_IP:-127.0.0.1}:3000:3000"
    networks:
      - monitoring
