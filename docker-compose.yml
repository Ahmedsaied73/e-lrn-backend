services:
  app:
    build: .
    ports:
      - "3005:3005"
    # All runtime config comes from .env (see .env.example for real var names).
    # NODE_ENV stays production for the container even if .env says otherwise.
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    volumes:
      - ./uploads:/usr/src/app/uploads