name: CI

on:
  push:
    branches: [Dev, main, master]
  pull_request:
    branches: [Dev, main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    # Auth-limiter tests assert REAL 429 tripping — the app needs a real Redis
    # (it falls back to a per-instance MemoryStore, which would make the
    # bucket-separation assertions moot). Service container provides one.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_postgres_password
          POSTGRES_DB: elearning_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d elearning_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      NODE_ENV: production
      PORT: 3106
      REDIS_ENABLED: "true"
      REDIS_URL: redis://127.0.0.1:6379

      # Ephemeral CI database (never depends on shared staging Supabase)
      DATABASE_URL: postgresql://postgres:ci_postgres_password@127.0.0.1:5432/elearning_ci?schema=public&sslmode=disable
      DIRECT_URL: postgresql://postgres:ci_postgres_password@127.0.0.1:5432/elearning_ci?schema=public&sslmode=disable
      JWTSECRET: ci_test_jwt_secret_value_0123456789abcdef0123456789abcdef
      REFRESH_TOKEN_SECRET: ci_test_refresh_secret_value_fedcba9876543210fedcba9876543210
      ADMIN_EMAIL: admin@elearning.com
      ADMIN_PASSWORD: CiTestAdminPassword#2026
      BUNNY_STREAM_LIBRARY_ID: "123456"
      BUNNY_STREAM_API_KEY: ci-bunny-api-key
      BUNNY_STREAM_READ_ONLY_API_KEY: ci-bunny-ro-key
      BUNNY_STREAM_TOKEN_KEY: ci-bunny-token-key
      SUPABASE_URL: https://ci-placeholder.supabase.co
      SUPABASE_SERVICE_KEY: ci_supabase_service_key_1234567890

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Deploy migrations to empty pgvector DB
        run: npx prisma migrate deploy

      - name: Seed deterministic CI fixtures
        run: node scripts/seedTestDb.js

      - name: Lint
        run: npm run lint

      - name: Run test suite (self-hosted server)
        run: npm test

      - name: Verify Prisma schema + migration status
        run: npx prisma validate && npx prisma migrate status